[package]
name = "last-zone-server"
version = "0.1.0"
edition = "2021"
description = "Self-hosted authoritative match server for DILLION: LAST ZONE"
license = "MIT"
publish = false

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync"] }
tokio-tungstenite = "0.24"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rmp-serde = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
