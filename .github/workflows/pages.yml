name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Stage site files
        run: python3 scripts/stamp.py "${GITHUB_SHA::10}" && mkdir _site && cp version.json index.html style.css app.js data.js games.js dilly-goes-wild.html dilly-gone-mad.html last-zone-preview.html last-zone.html _site/ && cp -r img vendor assets last-zone _site/ && for f in hub-online.js; do [ ! -f "$f" ] || cp "$f" _site/; done && for d in dilly-strike dillyverse dilly-fortress pinecrest-tycoon; do [ ! -d "$d" ] || { cp -r "$d" _site/ && rm -rf "_site/$d/server"; }; done && { [ ! -f CNAME ] || cp CNAME _site/; }
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
