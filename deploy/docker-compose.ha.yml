# Local / Single-Node HA Stack (PostgreSQL 16 + Redis 7 + All 3 Rust Backends)
# Run: docker compose -f deploy/docker-compose.ha.yml up --build
services:
  postgres:
    image: postgres:16-alpine
    command: ["postgres", "-c", "password_encryption=md5"]
    environment:
      POSTGRES_USER: dilly
      POSTGRES_PASSWORD: dilly_dev_password
      POSTGRES_DB: dillygaming
      POSTGRES_HOST_AUTH_METHOD: md5
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dilly -d dillygaming"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "dilly_redis_password"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "dilly_redis_password", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  dillyverse-server:
    build: ../dillyverse/server
    environment:
      PORT: "8080"
      DILLYVERSE_SEED: "DILLYVERSE-MP-01"
      DATABASE_URL: "postgres://dilly:dilly_dev_password@postgres:5432/dillygaming"
      REDIS_URL: "redis://:dilly_redis_password@redis:6379"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  dilly-strike-server:
    build: ../dilly-strike/server
    environment:
      PORT: "8081"
      # Ranked: same secret as the hub (export DILLY_SESSION_SECRET=$(openssl rand -hex 32) first).
      # Empty => ranked disabled, casual still works. See dilly-strike/server/README.md.
      DILLY_SESSION_SECRET: "${DILLY_SESSION_SECRET:-}"
      RANKED_TEAM_SIZE: "${RANKED_TEAM_SIZE:-5}"
      RANKED_ROUNDS_TO_WIN: "${RANKED_ROUNDS_TO_WIN:-13}"
      RANKED_WINDOW_BASE: "${RANKED_WINDOW_BASE:-100}"
      DATABASE_URL: "postgres://dilly:dilly_dev_password@postgres:5432/dillygaming"
      REDIS_URL: "redis://:dilly_redis_password@redis:6379"
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  dilly-gone-mad-server:
    build: ../dilly-gone-mad/server
    environment:
      PORT: "8082"
      DATABASE_URL: "postgres://dilly:dilly_dev_password@postgres:5432/dillygaming"
      REDIS_URL: "redis://:dilly_redis_password@redis:6379"
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  dilly-hub-server:
    build: ../dilly-hub/server
    environment:
      PORT: "8083"
      DILLY_SESSION_SECRET: "${DILLY_SESSION_SECRET:-}"  # signs hub session tokens used by ranked
      DATABASE_URL: "postgres://dilly:dilly_dev_password@postgres:5432/dillygaming"
      REDIS_URL: "redis://:dilly_redis_password@redis:6379"
    ports:
      - "8083:8083"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pg_data:
