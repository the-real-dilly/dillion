# Replace placeholder passwords before applying to production:
#   kubectl apply -f deploy/k8s/secrets.yaml
apiVersion: v1
kind: Secret
metadata:
  name: dilly-ha-secrets
  namespace: dilly-gaming
type: Opaque
stringData:
  POSTGRES_USER: "dilly"
  POSTGRES_PASSWORD: "CHANGE_ME_STRONG_PG_PASSWORD"
  POSTGRES_DB: "dillygaming"
  REDIS_PASSWORD: "CHANGE_ME_STRONG_REDIS_PASSWORD"
  DATABASE_URL: "postgres://dilly:CHANGE_ME_STRONG_PG_PASSWORD@postgres-ha-primary.dilly-gaming.svc.cluster.local:5432/dillygaming"
  REDIS_URL: "redis://:CHANGE_ME_STRONG_REDIS_PASSWORD@redis-ha.dilly-gaming.svc.cluster.local:6379"
