# ============================================================================
# Redis 7 High-Availability StatefulSet (3-Node Pub/Sub + AOF Persistence)
# ============================================================================
apiVersion: v1
kind: Service
metadata:
  name: redis-ha-headless
  namespace: dilly-gaming
spec:
  clusterIP: None
  selector:
    app: redis-ha
  ports:
    - name: redis
      port: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: redis-ha
  namespace: dilly-gaming
spec:
  selector:
    app: redis-ha
    statefulset.kubernetes.io/pod-name: redis-ha-0
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis-ha
  namespace: dilly-gaming
spec:
  serviceName: redis-ha-headless
  replicas: 3
  selector:
    matchLabels:
      app: redis-ha
  template:
    metadata:
      labels:
        app: redis-ha
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: redis-ha
                topologyKey: kubernetes.io/hostname
      containers:
        - name: redis
          image: redis:7-alpine
          command: ["sh", "-c"]
          args:
            - |
              if [ "$HOSTNAME" = "redis-ha-0" ]; then
                exec redis-server --appendonly yes --requirepass "$REDIS_PASSWORD"
              else
                exec redis-server --appendonly yes --requirepass "$REDIS_PASSWORD" --masterauth "$REDIS_PASSWORD" --replicaof redis-ha-0.redis-ha-headless.dilly-gaming.svc.cluster.local 6379
              fi
          ports:
            - containerPort: 6379
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dilly-ha-secrets
                  key: REDIS_PASSWORD
          volumeMounts:
            - name: redis-data
              mountPath: /data
          readinessProbe:
            exec:
              command: ["sh", "-c", "redis-cli -a \"$REDIS_PASSWORD\" ping | grep PONG"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["sh", "-c", "redis-cli -a \"$REDIS_PASSWORD\" ping | grep PONG"]
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
  volumeClaimTemplates:
    - metadata:
        name: redis-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: redis-ha-pdb
  namespace: dilly-gaming
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: redis-ha
