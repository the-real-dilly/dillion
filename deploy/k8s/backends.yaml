# ============================================================================
# DILLY GAMING HA RUST BACKENDS — 3 Replicas Each + HPA (3..12) + PDB
# Services: dillyverse-server (:8080), dilly-strike-server (:8081), dilly-gone-mad-server (:8082)
# ============================================================================
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dillyverse-server
  namespace: dilly-gaming
spec:
  replicas: 3
  selector:
    matchLabels:
      app: dillyverse-server
  template:
    metadata:
      labels:
        app: dillyverse-server
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: dillyverse-server
                topologyKey: kubernetes.io/hostname
      containers:
        - name: dillyverse-server
          image: ghcr.io/the-real-dilly/dillyverse-server:latest
          ports:
            - containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: DILLYVERSE_SEED
              value: "DILLYVERSE-MP-01"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: dilly-ha-secrets
                  key: DATABASE_URL
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: dilly-ha-secrets
                  key: REDIS_URL
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: dillyverse-server
  namespace: dilly-gaming
spec:
  selector:
    app: dillyverse-server
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: dillyverse-server-hpa
  namespace: dilly-gaming
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: dillyverse-server
  minReplicas: 3
  maxReplicas: 12
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: dillyverse-server-pdb
  namespace: dilly-gaming
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: dillyverse-server
